schema: spec-driven

context: |
  技术栈：
    - 宿主框架：DeepSeek Harness (DSH) 插件系统（一切皆插件）
    - 语言：TypeScript 5（ESM，package.json type: module）
    - 插件框架：Cordis（@deepseek-ai/cordis），ctx.effect 生命周期托管
    - 配置 Schema：Schemastery（@deepseek-ai/schemastery）
    - 客户端：React + 客户端槽位（slots / clientRuntime / SessionStandardProps）
    - 类型化 RPC：Typert RPC（构建时生成客户端桩 + 宿主服务桩）
    - 状态投影：无
    - 事件系统：无
    -  测试框架：Vitest（ESM 原生支持，与项目 TypeScript ESM 技术栈一致）
  开发运行方式：
    - 本地开发：cordis.yml + `pnpm dsh web --patch <绝对路径>/cordis.yml`
    - 分发：package.json 声明 dsh.bundle.patch（宿主）+ dsh.client（浏览器端）
  API 风格：宿主侧 HTTP 路由（ctx.webServer 注册 /dsh-session-host-* 接口）+ 客户端 Canvas 交互（DOM 定位 + fetch 调用宿主接口）
  关键领域约定：
    - 插件命名：dsh-session-tag-manage-host（宿主）/ dsh-session-tag-manage-client（客户端），双包拆分（packages/）
    - 宿主 HTTP 接口：/dsh-session-host-test 无参返回当前服务端时间；/dsh-session-host-get 参数为工作区，返回当前工作区 session 会话数量
    - host 参考实现：docs/dsh-session-manager.md（ctx.webServer 路由注册 + ctx.sessionPersistence 会话查询）
    - 客户端交互：在同 DOM 节点区域创建 canvas，绘制蓝色块支持点击；点击后控制台打印点击事件与点击时间日志
    - 客户端→宿主调用：点击后 fetch 调用 dsh-session-host HTTP 接口，响应后在控制台打印接口响应数据日志
    - client 参考实现：docs/dsh-tidychat.md（Canvas 绘制 + DOM 链路锚点定位，纯客户端永不触碰 host 数据源之外的 DOM）
  项目结构（基础设计，双包拆分）：
    - packages/dsh-session-host/: 宿主端插件（dsh-session-tag-manage-host），HTTP 接口实现
      - 基础设计：/dsh-session-host-test 返回服务端时间
      - 扩展设计：/dsh-session-host-get 按工作区返回 session 会话数量
    - packages/dsh-session-client/: 客户端插件（dsh-session-tag-manage-client），canvas 交互实现
      - 基础设计：同 DOM 节点区域创建 canvas，绘制蓝色块支持点击，点击后控制台打印事件/时间日志
      - 扩展设计：点击后调用 dsh-session-host HTTP 接口，响应后控制台打印接口响应数据日志
    - docs/: 设计文档（design.md 为设计稿；dsh-session-manager.md / dsh-tidychat.md 为宿主/客户端官方 API 核对依据）

rules:
  workflow:
    - 探索模式 (explore) → 提案模式 (propose) → 执行模式 (apply-change)；
    - 探索过程中涉及不确定的点(需求、UI交互、功能点细节、上下文依赖、技术栈选择、公共组件、公共库等)，必须列出待确认清单，禁止假设；
    - 探索过程中，列出待确认清单后，优先进行深度思考，给出对应的解决方案(从长期架构、可维护性、可扩展性、运行稳定性角度考虑)；
    - 探索结束后，必须先退出探索模式，创建提案，禁止直接执行；
    - 提案必须经用户确认后，才能进入执行阶段；
  tasks:
    - 每个任务最大 2 小时
    - 禁止在提案确认前创建或执行任务
    - 属于文件变更的任务，必须包含变更文件路径和完整变更内容（diff 新增/删除/修改 行形式呈现）；
    - |
      文件变更任务的 diff 代码片段案例模板（新增用 `+`、删除用 `-`、修改用 `+`/`-` 对；每处变更须标注 变更文件 路径）：
      ```
      - [ ] 1.1 在 src/config.ts 新增 logStoreFile 配置项
          变更文件：src/config.ts
          变更内容：
          ```diff
          + logStoreFile: Schema.boolean().default(true), // 是否落盘执行日志
          ```
      - [ ] 1.2 将 src/tagger.ts 的 analyze() 由固定 LLM 兜底改为按开关分流
          变更文件：src/tagger.ts
          变更内容（修改 diff）：
          ```diff
          - return await this.llmAnalyze(events, hint);
          + return config.analysisLLM
          +     ? await this.llmAnalyze(events, hint)
          +     : this.keywordAnalyze(extracted, hint);
          ```
      ```
      说明：新增文件（如 src/logger.ts）以全量 `+` 行呈现；删除文件以全量 `-` 行呈现；仅当整块变更内容较大或新建文件时，可摘录关键 diff 行并在任务描述中指明其余改动要点，禁止只写文件路径而无任何 diff 片段。
    - |
      执行已确定的任务时，禁止不必要的提问，必须完整执行所有任务：
      1. 提案确认后，进入执行阶段，禁止中途暂停询问是否继续；
      2. 遇到阻塞问题时，优先尝试自主解决，仅在无法解决时才提问；
      3. 执行过程中不汇报进度，仅在完成或遇到严重问题时汇报；
      4. 完整执行所有任务，包括单元测试、验证、审计等后续任务；
      5. 执行完成后，一次性汇报所有任务完成情况。
    - |
      tasks 只输出一个文件（tasks.md），规范如下：
      1. tasks.md 使用 checkbox 格式列出所有任务状态（让 openspec 工具能够识别）；
      2. tasks.md 的最后一个任务必须为「sub-agent 任务审计任务」；
      3. 每个 spec 执行完成后，必须立即执行 Sub-agent 任务审计；
      4. 审计发现问题后，必须修复问题并重新审计。

  proposal:
    - 设计提案时，必须包含验证步骤
    - 提案必须包含：设计说明、任务列表、验证方案
  design:
    - 设计过程中，必须考虑项目架构、可维护性、可扩展性、运行稳定性等因素；
    - 复杂场景需要输出`mermaid`格式的序列图、类图、状态图等；
    - 设计必须包含：设计说明、任务列表、验证方案、验证步骤；
  specs:
    - 每个 spec 必须包含：模块归属，便于后续sync执行同步时合并文件；
    - 使用 Given/When/Then 格式
    - 优先参考现有模式而非创造新模式
  sync:
    - 在执行spec同步时，必须按模块同步，多个属于同一个模块的spec必须合并文件；
  execution:
    - 项目识别：openspec 命令必须从项目根目录（含 openspec/ 及其 config.yaml/project.md 的目录）运行；禁止从工作区根或 openspec/ 内部运行，避免识别失败；
    - 执行前准备：运行 `openspec status --change <name> --json` 与 `openspec instructions apply --change <name> --json`，按其 contextFiles 读取 proposal / design / specs / tasks 等上下文文件后再动手；
    - 逐个完成：按 tasks.md 顺序逐个完成任务；每完成一个任务立即将 `- [ ]` 置为 `- [x]`，禁止跳步或批量勾选；
    - 变更聚焦：每个任务只做该任务要求的最小、聚焦改动，避免无关重构与过度设计；
    - 文件变更规范：属于文件变更的任务必须写明变更文件路径与完整变更内容（以 diff 新增/删除/修改 行形式呈现）；
    - 审计闭环：每个 spec 完成后立即启动 sub-agent 任务审计（对照对应 capability spec 与 design 契约），审计发现问题必须修复并重新审计直至通过；
    - 自主解决：遇到阻塞问题优先尝试自主解决，仅在无法解决时才向用户提问；
    - 禁止打断：执行已确认任务时禁止不必要的提问，须完整执行所有任务（含单元测试、验证、审计等收尾任务）；
    - 完成后汇报：执行完成后一次性汇报全部任务完成情况，不中途汇报进度；
    - 保持最小消耗：按最少调用、最低消耗设计执行方案，避免重复调用与扩大读取范围；